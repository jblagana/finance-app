name: Live two-instance QR sharing
on: [push]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --prefix /tmp/preview playwright qrcode && /tmp/preview/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          echo 'Checking deployed Owed UI'
          node tools/owed-preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: owed-screen-snips
          path: snips/*.png

  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ddc4ece538db6fd6fee3a9177d0c76c5dedc0d2
          path: finance-app
      - name: Release checks
        shell: pwsh
        working-directory: finance-app
        run: |
          ./tools/release.ps1 v75.64
      - name: Verified stamp
        working-directory: finance-app
        shell: pwsh
        run: |
          Select-String 'var SHELL_RELEASE =' app.js
          git diff --stat

name: Inspect Owed release
on: [push]
permissions:
  contents: read
  actions: read
jobs:
  snips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: owed-screen-snips
          path: snips
          github-token: ${{ github.token }}
          run-id: 46082486112
      - name: Read preview images
        run: |
          for f in snips/*.png; do
            echo "SNIP $(basename "$f")"
            base64 -w 1000 "$f"
            echo ENDSNIP
          done